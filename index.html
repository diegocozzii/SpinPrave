<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SpinPrave Casino Suite</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SpinPrave">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="lobby-wrapper">
        <header class="lobby-header">
            <div class="brand">
                <h1>SPINPRAVE <small>CASINO</small></h1>
                <p class="tagline">LIVE LUXURY GAMING</p>
            </div>
            <div class="balance-card">
                <span class="label">SALDO DISPONIBILE</span>
                <div class="val"><span id="lobby-balance">1000</span> PC</div>
                <button class="refill-btn" id="lobby-refill" onclick="refillLobby()">RICARICA +1000 PC</button>
            </div>
        </header>

        <main class="games-grid">
            <!-- Scheda Roulette -->
            <div class="game-card" onclick="window.location.href='roulette/index.html'">
                <div class="card-badge">LIVE 24/7</div>
                <div class="game-icon">🎰</div>
                <h2>ROULETTE LIVE</h2>
                <p>37 Numeri • Tabellino Statistiche • Spin 15s</p>
                <button class="enter-btn">ENTRA AL TAVOLO</button>
            </div>

            <!-- Scheda Blackjack -->
            <div class="game-card" onclick="window.location.href='blackjack/index.html'">
                <div class="card-badge">LIVE DEALER</div>
                <div class="game-icon">♠️</div>
                <h2>BLACKJACK PRO</h2>
                <p>Pagamento 3:2 • Double Down • Dealer Stand on 17</p>
                <button class="enter-btn">ENTRA AL TAVOLO</button>
            </div>
        </main>

        <footer class="lobby-footer">
            <p>SpinPrave Casino Gaming Experience • Solo valuta virtuale PraveCoin (PC)</p>
        </footer>
    </div>

    <script src="shared.js"></script>
    <script>
        function updateLobbyUI() {
            const bal = getPraveBalance();
            document.getElementById('lobby-balance').innerText = bal;
            document.getElementById('lobby-refill').style.display = (bal <= 0) ? 'inline-block' : 'none';
        }
        function refillLobby() {
            setPraveBalance(1000);
            updateLobbyUI();
        }
        window.addEventListener('load', updateLobbyUI);
        window.addEventListener('focus', updateLobbyUI);
    </script>
</body>
</html>
