<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SpinPrave Blackjack Pro</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="apple-touch-icon" href="../favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../favicon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="rotate-screen">
        <div class="rotate-box">
            <div class="rotate-icon">🔄</div>
            <p>Ruota il dispositivo in orizzontale per giocare a Blackjack.</p>
        </div>
    </div>

    <div class="game-wrapper">
        <header class="top-bar">
            <div class="top-left">
                <button class="btn-lobby" onclick="window.location.href='../index.html'">← LOBBY</button>
                <div class="brand-name">BLACKJACK <small>LIVE PRO</small></div>
            </div>
            <div id="bj-msg">PIAZZA LA TUA PUNTATA</div>
            <div class="deck-info">MAZZO: <span id="cards-left">312</span> CARTE</div>
        </header>

        <main class="table-felt">
            <!-- Area Dealer -->
            <div class="hand-area dealer-area">
                <div class="hand-label">BANCO <span class="score-badge" id="dealer-score">-</span></div>
                <div class="cards-box" id="dealer-cards"></div>
            </div>

            <!-- Regole sul feltro -->
            <div class="felt-logo">
                <div class="rule-line">BLACKJACK PAYS 3 TO 2</div>
                <div class="rule-sub">Dealer stands on 17 • Insurance pays 2 to 1 • Double on 9-11</div>
            </div>

            <!-- Spot Puntata -->
            <div class="bet-spot-bj" id="bj-bet-circle" onclick="placeChipOnTable()">
                <span class="spot-title" id="spot-title">PUNTATA</span>
                <div id="table-chip-stack"></div>
            </div>

            <!-- Area Giocatore (supporta mano singola o Split su due mani) -->
            <div class="player-hands-container" id="player-hands-container">
                <!-- Mano 1 (Standard o Split 1) -->
                <div class="hand-area player-area active-hand" id="hand-0-area">
                    <div class="cards-box" id="player-cards-0"></div>
                    <div class="hand-label">LE TUE CARTE <span class="score-badge" id="player-score-0">-</span></div>
                </div>
                <!-- Mano 2 (Creata in caso di Split) -->
                <div class="hand-area player-area" id="hand-1-area" style="display: none;">
                    <div class="cards-box" id="player-cards-1"></div>
                    <div class="hand-label">MANO 2 <span class="score-badge" id="player-score-1">-</span></div>
                </div>
            </div>
        </main>

        <footer class="bottom-bar">
            <div class="footer-left">
                <div class="stat-boxes">
                    <div class="stat-box saldo">SALDO: <span id="balance">1000</span> PC</div>
                    <div class="stat-box puntata">PUNTATA: <span id="current-bet">0</span> PC</div>
                </div>
                <button id="refill-btn" class="btn-refill" onclick="refillBJBalance()">+ 1000 PC</button>
            </div>

            <!-- Selettore Fiches -->
            <div class="chips-selector" id="chips-container">
                <div class="chip-item c1 active" data-val="1">1</div>
                <div class="chip-item c5" data-val="5">5</div>
                <div class="chip-item c10" data-val="10">10</div>
                <div class="chip-item c25" data-val="25">25</div>
                <div class="chip-item c50" data-val="50">50</div>
                <div class="chip-item c100" data-val="100">100</div>
            </div>

            <!-- Controlli di Gioco -->
            <div class="action-buttons">
                <!-- Fase Puntata -->
                <button class="btn-alt" id="btn-clear" onclick="clearBet()">ANNULLA</button>
                <button class="btn-main" id="btn-deal" onclick="startDeal()">DISTRIBUISCI</button>

                <!-- Prompt Assicurazione -->
                <button class="btn-game btn-ins-yes" id="btn-ins-yes" onclick="takeInsurance(true)" style="display: none;">ASSICURA (2:1)</button>
                <button class="btn-game btn-ins-no" id="btn-ins-no" onclick="takeInsurance(false)" style="display: none;">RIFIUTA</button>

                <!-- Fase Decisionale -->
                <button class="btn-game btn-hit" id="btn-hit" onclick="playerHit()" style="display: none;">CARTA</button>
                <button class="btn-game btn-stand" id="btn-stand" onclick="playerStand()" style="display: none;">STAI</button>
                <button class="btn-game btn-double" id="btn-double" onclick="playerDouble()" style="display: none;">RADDOPPIA</button>
                <button class="btn-game btn-split" id="btn-split" onclick="playerSplit()" style="display: none;">DIVIDI</button>
            </div>
        </footer>
    </div>

    <script src="../shared.js"></script>
    <script src="script.js"></script>
</body>
</html>
